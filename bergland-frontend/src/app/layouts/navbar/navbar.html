<nav class="side-navbar" [class.collapsed]="isCollapsed">
    <ul class="nav-links">
        <!-- Events -->
        <li class="nav-item" [class.collapsed]="isCollapsed">
            <a routerLink="/events" routerLinkActive="active">
                <i class="fa-solid fa-calendar-days"></i>
                @if (!isCollapsed) { <span class="label">Events</span> }
                <span class="tooltip-text tooltip-bottom">Events</span>
            </a>
        </li>

        <!-- Produkte bestellen -->
        <li class="nav-item" [class.collapsed]="isCollapsed">
            <a routerLink="/products-order" routerLinkActive="active">
                <i class="fa-solid fa-cart-shopping"></i>
                @if (!isCollapsed) { <span class="label">Produkte bestellen</span> }
                <span class="tooltip-text tooltip-bottom">Produkte bestellen</span>
            </a>
        </li>


        <!-- Meine Anmeldungen -->
        <li class="nav-item" [class.collapsed]="isCollapsed">
            <a routerLink="/my-registrations" routerLinkActive="active">
                <i class="fa-solid fa-book"></i>
                @if (!isCollapsed) { <span class="label">Meine Anmeldungen</span> }
                <span class="tooltip-text tooltip-bottom">Meine Anmeldungen</span>
            </a>
        </li>

        <!-- Meine Buchungen -->
        <li class="nav-item" [class.collapsed]="isCollapsed">
            <a routerLink="/my-bookings" routerLinkActive="active">
                <i class="fa-solid fa-clipboard-check"></i>
                @if (!isCollapsed) { <span class="label">Meine Buchungen</span> }
                <span class="tooltip-text tooltip-bottom">Meine Buchungen</span>
            </a>
        </li>
    </ul>

    <!-- 🔹 Admin-Bereich -->
    @if (isAdmin) {
    <div class="admin-section">
        <button class="admin-btn" routerLink="/admin">
            <i class="fa-solid fa-gear"></i>
            @if (!isCollapsed) { <span class="label">Administration</span> }
            <span class="tooltip-text tooltip-bottom">Administration</span>
        </button>
    </div>
    } @else {
    <div class="admin-section-spacer"></div>
    }

    <!-- 🔹 Toggle unten -->
    <div class="nav-bottom">
        <button class="collapse-toggle" (click)="toggleCollapse()" aria-label="Sidebar umschalten">
            <i class="fa-solid" [ngClass]="isCollapsed ? 'fa-angles-right' : 'fa-angles-left'"></i>
            @if (!isCollapsed) { <span class="label">Einklappen</span> }
            <span class="tooltip-text tooltip-bottom">
                {{ isCollapsed ? 'Ausklappen' : 'Einklappen' }}
            </span>
        </button>
    </div>
</nav>
