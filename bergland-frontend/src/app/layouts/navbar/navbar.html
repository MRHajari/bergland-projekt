<nav class="side-navbar" [class.collapsed]="isCollapsed">
    <ul class="nav-links">
        <li class="nav-item" [class.collapsed]="isCollapsed">
            <a routerLink="/events" routerLinkActive="active">
                <i class="fa-solid fa-calendar-days"></i>
                @if (!isCollapsed) {
                <span class="label">Events</span>
                }
                <span class="tooltip-text tooltip-bottom">Events</span>
            </a>
        </li>

        <li class="nav-item" [class.collapsed]="isCollapsed">
            <a routerLink="/booking" routerLinkActive="active">
                <i class="fa-solid fa-book"></i>
                @if (!isCollapsed) {
                <span class="label">Buchungen</span>
                }
                <span class="tooltip-text">Buchungen</span>
            </a>
        </li>

        <li class="nav-item" [class.collapsed]="isCollapsed">
            <a routerLink="/profile" routerLinkActive="active">
                <i class="fa-solid fa-user"></i>
                @if (!isCollapsed) {
                <span class="label">Profil</span>
                }
                <span class="tooltip-text">Profil</span>
            </a>
        </li>
    </ul>

    <!-- 🔹 Admin-Bereich -->
    @if (isAdmin) {
    <div class="admin-section">
        <button class="admin-btn" routerLink="/admin">
            <i class="fa-solid fa-gear"></i>
            @if (!isCollapsed) {
            <span class="label">Administration</span>
            }
            <span class="tooltip-text">Administration</span>
        </button>
    </div>
    }

    <!-- 🔹 Toggle unten -->
    <div class="nav-bottom">
        <button class="collapse-toggle" (click)="toggleCollapse()" aria-label="Sidebar umschalten">
            <i class="fa-solid" [ngClass]="isCollapsed ? 'fa-angles-right' : 'fa-angles-left'"></i>

            @if (!isCollapsed) {
            <span class="label">Einklappen</span>
            }

            <span class="tooltip-text">
                {{ isCollapsed ? 'Ausklappen' : 'Einklappen' }}
            </span>
        </button>
    </div>
</nav>
