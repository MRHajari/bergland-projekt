<header class="page-header">
    <div class="header-left">
        <img src="assets/logo.svg" alt="Bergland Logo" class="logo" />
        <span class="brand">Bergland</span>
    </div>

    <div class="header-center">
        <h2>{{ title }}</h2>
        @if (subtitle) {
        <p class="subtitle">{{ subtitle }}</p>
        }
    </div>

    <div class="header-right">
        <div class="user-info" (click)="goToProfile()">
            <lucide-icon [name]="icons.User" class="user-icon"></lucide-icon>
            <div class="user-text">
                <span class="username">{{ userName || 'Gast' }}</span>
                <span class="email">{{ userEmail }}</span>
            </div>
        </div>
        <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
</header>
