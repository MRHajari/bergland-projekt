<div class="toast-stack" aria-live="polite" aria-atomic="true">
  @for (toast of toastService.messages(); track toast.id) {
    <div class="toast-card" [class]="'toast-card toast-' + toast.type" role="status">
      <div class="toast-content">
        <span class="toast-icon">
          @switch (toast.type) {
            @case ('success') { ✓ }
            @case ('warning') { ! }
            @case ('error') { ⚠ }
            @default { i }
          }
        </span>
        <span class="toast-message">{{ toast.message }}</span>
      </div>

      <button type="button" class="toast-close" (click)="dismiss(toast.id)" aria-label="Meldung schließen">
        ×
      </button>
    </div>
  }
</div>
