<div class="verify-page">
    <div class="verify-card">
        <div class="logo">
            <img src="assets/logo.svg" alt="Pfälzer Bergland Logo" />
        </div>

        <h2>E-Mail-Verifikation</h2>

        @if (loading) {
        <div>Bitte warten...</div>
        }

        @if (message) {
        <div class="success">{{ message }}</div>
        }

        @if (error) {
        <div class="error">{{ error }}</div>
        }

        @if (!loading && !error) {
        <p>Du wirst automatisch weitergeleitet...</p>
        }

        @if (error) {
        <button (click)="goToRegister()" class="primary">
            Zur Registrierung
        </button>
        }
    </div>
</div>
