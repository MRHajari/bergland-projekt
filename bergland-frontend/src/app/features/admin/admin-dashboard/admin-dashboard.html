<div class="admin-dashboard">
    <h1>Administration</h1>

    <nav class="admin-navigation" aria-label="Verwaltungsbereiche">
        @for (group of groups; track group.id) {
        <section class="navigation-group" [attr.aria-labelledby]="'admin-' + group.id">
            <h2 [id]="'admin-' + group.id">{{ group.title }}</h2>
            <ul>
                @for (link of group.links; track link.route) {
                <li>
                    <a [routerLink]="link.route" class="admin-link">
                        <i [ngClass]="link.icon" class="destination-icon" aria-hidden="true"></i>
                        <span>{{ link.title }}</span>
                        <i class="fa-solid fa-chevron-right link-arrow" aria-hidden="true"></i>
                    </a>
                </li>
                }
            </ul>
        </section>
        }
    </nav>
</div>
