<h2>Make a Booking</h2>

<form (ngSubmit)="submitBooking()" #bookingForm="ngForm">
    <label for="event">Select Event:</label>
    <select id="event" name="event" [(ngModel)]="selectedEventId" required>
        <option [ngValue]="null" disabled selected>Select an event</option>
        <option *ngFor="let event of events" [ngValue]="event.id">
            {{ event.name }} ({{ event.date | date }})
        </option>
    </select>

    <br />

    <label for="guests">Number of Guests:</label>
    <input type="number" id="guests" name="guests" [(ngModel)]="guestCount" min="1" required />

    <br />

    <button type="submit" [disabled]="!bookingForm.form.valid">Book Now</button>
</form>

<p *ngIf="message" class="success">{{ message }}</p>
<p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
